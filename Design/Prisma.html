  @media(max-width:820px) {

<script>
(() => {
  const root = document.getElementById('portex-prisma');
  const products = [
    {id:'spectra',name:'Spectra',kind:'apps',category:'Diagnose',icon:'activity',version:'0.1.110',old:'0.1.110',size:'1,8 MB',status:'installed',description:'Benchmarks und Einblicke in deine Hardware.',path:'C:\\R4OS\\DIAG'},
    {id:'mines',name:'Minesweeper',kind:'apps',category:'Spiele',icon:'flag',version:'0.1.0',old:'',size:'768 KB',status:'available',description:'Der Klassiker. Ein Feld, viele Möglichkeiten.',path:'C:\\Games\\Minesweeper'},
    {id:'solitaire',name:'Solitaire',kind:'apps',category:'Spiele',icon:'club',version:'0.1.7',old:'0.1.6',size:'1,2 MB',status:'update',description:'Eine kleine Pause mit einem guten Kartenspiel.',path:'C:\\Games\\Solitaire'},
    {id:'r4img',name:'R4IMG',kind:'libraries',category:'Runtime',icon:'image',version:'0.1.2',old:'0.1.2',size:'420 KB',status:'installed',description:'Bildformate für deine R4OS-Anwendungen.',path:'C:\\R4OS\\LIBS\\R4IMG.R4L'},
    {id:'kernel',name:'R4OS Kernel',kind:'kernel',category:'Kernel',icon:'cpu',version:'0.1.456',old:'0.1.455',size:'8,4 MB',status:'update',description:'Der Kern deines Systems. Aktivierung nach einem Neustart.',path:'Über die bestehende Bootinstallation'}
  ];
  const stateByDesign = {};
  const appByDesign = {};
  const titles = {discover:'Entdecken',installed:'Installiert',updates:'Aktualisierungen'};
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const appIcon = p => `<span class="px-app-icon">${icon(p.icon)}</span>`;
  const statusText = p => p.status==='installed' ? 'Installiert' : p.status==='update' ? 'Update verfügbar' : p.size;
  const actionText = p => p.status==='installed' ? 'Details' : p.status==='update' ? 'Update' : 'Installieren';
  const text = value => String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  const get = id => products.find(p=>p.id===id);

  function refreshIcons() { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); }
  function persist() {
    const privateContent = {};
    for(const [key,value] of Object.entries(stateByDesign)) privateContent[key] = {view:value.view,kind:value.kind,category:value.category,query:value.query,selected:value.selected};
    if(window.openai?.setWidgetState) window.openai.setWidgetState({privateContent}).catch(()=>{});
  }
  function visibleProducts(s) {
    return products.filter(p => (s.kind==='all'||p.kind===s.kind) && (s.category==='Alle'||s.category===p.category) && (s.view!=='installed'||p.status!=='available') && (s.view!=='updates'||p.status==='update') && (p.name+' '+p.description).toLocaleLowerCase('de').includes(s.query.toLocaleLowerCase('de')));
  }
  function inspector(app,p) {
    const holder=app.querySelector('[data-inspector]'); if(!holder) return;
    holder.innerHTML = p ? `${appIcon(p)}<div><h3>${p.name}</h3><span class="px-dim px-small">${p.category} · ${p.kind==='apps'?'Anwendung':p.kind==='libraries'?'Runtime-Library':'Systemkern'}</span></div><p>${p.description}</p><div class="px-detail-facts"><div class="px-detail-fact"><span class="px-dim">Verfügbar</span><span>${p.version}</span></div><div class="px-detail-fact"><span class="px-dim">Installiert</span><span>${p.old||'Noch nicht'}</span></div><div class="px-detail-fact"><span class="px-dim">Download</span><span>${p.size}</span></div></div><div class="px-install-path"><span>${p.old?'Bestehender Installationsort':'Installationsort'}</span><div class="px-path-text">${text(p.path)}</div>${!p.old&&p.kind==='apps'?'<button class="px-inline-button cursor-interaction" data-customize="'+p.id+'">Anpassen</button>':''}</div><button class="px-button px-primary cursor-interaction" data-detail="${p.id}">${p.status==='installed'?'Details ansehen':p.status==='update'?'Aktualisieren':'Installieren'} ${icon(p.status==='installed'?'arrow-right':'download')}</button>` : '<p>Wähle ein Paket aus der Liste.</p>';
  }
  function render(app) {
    const s=stateByDesign[app.dataset.design];
    const list=app.querySelector('[data-list]');
    const feature=app.querySelector('[data-feature]');
    const featureVisible=Boolean(feature&&s.view==='discover'&&s.kind==='apps'&&s.category==='Alle'&&!s.query);
    if(feature) feature.hidden=!featureVisible;
    const items=visibleProducts(s).filter(p=>!featureVisible||p.id!=='spectra').sort((a,b)=>a.name.localeCompare(b.name,'de',{sensitivity:'base',numeric:true}));
    const title=app.querySelector('[data-page-title]');
    if(title) title.textContent=titles[s.view];
    app.querySelector('[data-list-title]').textContent=s.view==='updates'?'Verfügbare Updates':s.view==='installed'?'Deine installierte Software':app.dataset.design==='dock'?'Verfügbare Pakete':app.dataset.design==='prisma'?'Deine nächste Entdeckung':'Für dein R4OS';
    app.querySelector('[data-list-count]').textContent=items.length+' '+(s.kind==='apps'?'Apps':'Pakete');
    app.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===s.view; b.classList.toggle('is-active',active); b.setAttribute('aria-pressed',String(active));});
    app.querySelectorAll('[data-kind]').forEach(b=>{const active=b.dataset.kind===s.kind; b.classList.toggle('is-active',active);b.setAttribute('aria-pressed',String(active));});
    app.querySelectorAll('[data-category]').forEach(b=>{const active=b.dataset.category===s.category;b.classList.toggle('is-active',active);b.setAttribute('aria-pressed',String(active));});
    const previousBatch=app.querySelector('.px-batch'); if(previousBatch) previousBatch.remove();
    if(s.view==='updates'&&items.length) { const batch=document.createElement('button');batch.className='px-button px-primary px-batch cursor-interaction';batch.dataset.batch='true';batch.textContent='Alle aktualisieren';app.querySelector('[data-list-title]').parentElement.append(batch); }
    if(!items.length) list.innerHTML='<div class="px-empty">Hier gibt es gerade keine passenden Pakete.</div>';
    else if(list.dataset.layout==='rows') {
      if(!items.some(p=>p.id===s.selected)) s.selected=items[0].id;
      list.innerHTML=items.map(p=>`<button class="px-package-row cursor-interaction ${s.selected===p.id?'is-selected':''}" data-select="${p.id}" aria-pressed="${s.selected===p.id}">${appIcon(p)}<span class="px-row-copy"><span class="px-app-name">${p.name}</span><span class="px-dim">${p.category} · ${p.version}</span></span><span class="px-row-trailing"><span class="px-status-label">${p.status==='available'?'Verfügbar':statusText(p)}</span><span class="px-dim">${p.size}</span></span></button>`).join('');
    } else if(list.dataset.layout==='tiles') list.innerHTML=items.map(p=>`<button class="px-app-tile cursor-interaction" data-detail="${p.id}">${appIcon(p)}<span class="px-tile-copy"><span class="px-app-name">${p.name}</span><span class="px-dim">${p.category} · ${statusText(p)}</span></span>${icon(p.status==='update'?'refresh-cw':p.status==='installed'?'arrow-up-right':'download')}</button>`).join('');
    else list.innerHTML=items.map(p=>`<article class="px-app-card"><button class="px-card-detail cursor-interaction" data-detail="${p.id}">${appIcon(p)}<span><span class="px-app-name">${p.name}</span><br><span class="px-dim">${p.category}</span></span></button><p class="px-card-description">${p.description}</p><div class="px-card-footer"><span class="px-dim px-small">${p.status==='available'?p.size:p.version}</span><button class="px-button ${p.status==='available'?'px-primary':'px-quiet'} cursor-interaction" data-detail="${p.id}">${actionText(p)}</button></div></article>`).join('');
    inspector(app,items.find(p=>p.id===s.selected)||items[0]);
    refreshIcons();
  }
  function dialog(app,id,customize=false) {
    const s=stateByDesign[app.dataset.design];s.dialog=id;
    const p=get(id);const batch=id==='batch';
    const overlay=app.querySelector('[data-overlay]'); overlay.hidden=false;
    const heading=batch?'Alle aktualisieren':p.name;
    overlay.innerHTML=`<section class="px-dialog" role="dialog" aria-modal="true" aria-label="${heading}"><div class="px-dialog-head">${batch?`<span class="px-app-icon">${icon('refresh-cw')}</span>`:appIcon(p)}<div><h3>${heading}</h3><span class="px-dim px-small">${batch?'Apps, Libraries und Kernel':p.category+' · '+p.version}</span></div></div><p>${batch?'Die angebotenen Aktualisierungen werden heruntergeladen und installiert. Ein erforderlicher Neustart wird anschließend angezeigt.':p.description}</p>${!batch?`<div class="px-detail-facts"><div class="px-detail-fact"><span class="px-dim">${p.old?'Installiert':'Downloadgröße'}</span><span>${p.old||p.size}</span></div>${p.old&&p.status==='update'?`<div class="px-detail-fact"><span class="px-dim">Neue Version</span><span>${p.version}</span></div>`:''}</div><div class="px-install-path"><span>${p.old?'Bestehender Installationsort':'Installationsort'}</span><input class="px-path-input" aria-label="Installationsort" value="${text(p.path)}" ${customize&&!p.old?'':'readonly'}>${!p.old&&p.kind==='apps'?'<button class="px-inline-button cursor-interaction" data-edit-path>Anpassen</button>':''}</div>${p.kind==='kernel'?'<p>Dieses Update wird nach einem Neustart aktiviert.</p>':''}`:''}<div class="px-dialog-actions">${!batch&&p.status==='installed'&&p.kind==='apps'?'<button class="px-button cursor-interaction" data-remove>Deinstallieren</button>':''}<button class="px-button cursor-interaction" data-close>Schließen</button>${batch||p.status!=='installed'?`<button class="px-button px-primary cursor-interaction" data-start>${batch||p.status==='update'?'Aktualisieren':'Installieren'} ${icon('download')}</button>`:''}</div></section>`;
    refreshIcons();
    (customize?overlay.querySelector('input'):overlay.querySelector('[data-close]'))?.focus({preventScroll:true});
  }
  function closeDialog(app) {const s=stateByDesign[app.dataset.design];s.dialog=null;app.querySelector('[data-overlay]').hidden=true;app.querySelector('[data-search]')?.focus({preventScroll:true});}
  function progress(app) {
    const s=stateByDesign[app.dataset.design];const p=get(s.dialog);const batch=s.dialog==='batch';
    const kilobytes=item=>parseFloat(item.size.replace(',','.'))*(item.size.endsWith('MB')?1024:1);
    const total=batch?products.filter(item=>item.status==='update').reduce((sum,item)=>sum+kilobytes(item),0):kilobytes(p);
    const format=value=>value>=1024?(value/1024).toLocaleString('de-DE',{maximumFractionDigits:1})+' MB':value.toLocaleString('de-DE',{maximumFractionDigits:0})+' KB';
    const rate=total>2048?1024:128;
    app.querySelector('[data-overlay]').innerHTML=`<section class="px-dialog" role="dialog" aria-modal="true" aria-label="Downloadfortschritt"><div class="px-dialog-head"><span class="px-app-icon">${icon('download')}</span><div><h3>${batch?'Updates laden':p.name+' laden'}</h3><span class="px-dim px-small">Download läuft</span></div></div><div class="px-download"><div class="px-download-facts"><span>${format(total/2)} von ${format(total)}</span><span>50 %</span></div><div class="px-progress" role="progressbar" aria-label="Download" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><span></span></div><div class="px-download-facts px-dim"><span>${format(rate)}/s</span><span>Noch ${Math.ceil(total/2/rate)} Sekunden</span></div></div><div class="px-dialog-actions"><button class="px-button cursor-interaction" data-close>Abbrechen</button></div></section>`;
    refreshIcons();app.querySelector('[data-overlay] button').focus({preventScroll:true});
  }
  root.querySelectorAll('[data-design]').forEach(app=>{
    const key=app.dataset.design;appByDesign[key]=app;
    const initial=window.openai?.widgetState?.privateContent?.[key]||{};
    stateByDesign[key]={view:['discover','installed','updates'].includes(initial.view)?initial.view:'discover',kind:['apps','libraries','kernel','all'].includes(initial.kind)?initial.kind:'apps',category:['Alle','Spiele','Diagnose'].includes(initial.category)?initial.category:'Alle',query:typeof initial.query==='string'?initial.query:'',selected:get(initial.selected)?initial.selected:'mines',dialog:null};
    app.querySelector('[data-search]').value=stateByDesign[key].query;
    app.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!app.contains(button))return;
      const s=stateByDesign[key];
      if(button.dataset.view) {s.view=button.dataset.view;s.category='Alle';s.kind=s.view==='updates'?'all':'apps';s.query='';app.querySelector('[data-search]').value='';render(app);persist();}
      else if(button.dataset.kind) {s.kind=button.dataset.kind;s.category='Alle';render(app);persist();}
      else if(button.dataset.category) {s.category=button.dataset.category;s.kind='apps';s.view='discover';render(app);persist();}
      else if(button.dataset.select) {s.selected=button.dataset.select;render(app);persist();}
      else if(button.dataset.detail) dialog(app,button.dataset.detail);
      else if(button.dataset.customize) dialog(app,button.dataset.customize,true);
      else if(button.hasAttribute('data-batch')) dialog(app,'batch');
      else if(button.hasAttribute('data-close')) closeDialog(app);
      else if(button.hasAttribute('data-edit-path')) {const input=app.querySelector('.px-path-input');input.readOnly=false;input.focus({preventScroll:true});input.select();}
      else if(button.hasAttribute('data-start')) progress(app);
      else if(button.hasAttribute('data-remove')) {app.querySelector('[data-status]').textContent='Entfernen würde nur App und eigene Verknüpfungen betreffen. Nutzerdaten bleiben erhalten.';closeDialog(app);}
    });
    app.addEventListener('input',event=>{if(event.target.matches('[data-search]')){stateByDesign[key].query=event.target.value;render(app);persist();}});
    app.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&!app.querySelector('[data-overlay]').hidden) closeDialog(app);
      if(event.key==='Tab'&&!app.querySelector('[data-overlay]').hidden) {const focusable=[...app.querySelector('[data-overlay]').querySelectorAll('button,input:not([readonly])')];const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
    render(app);
    if(globalThis.Tweak) {
      const design={accent:{orbit:'#455fe1',dock:'#11786e',prisma:'#7950d0'}[key],radius:{orbit:12,dock:7,prisma:15}[key],appearance:'System'};
      const apply=()=>{app.style.setProperty('--px-accent-solid',design.accent);app.style.setProperty('--px-accent',`light-dark(${design.accent},color-mix(in srgb,${design.accent},white 55%))`);app.style.setProperty('--px-tint',`light-dark(color-mix(in srgb,${design.accent} 9%,white),color-mix(in srgb,${design.accent} 24%,#161a22))`);app.style.setProperty('--px-radius',design.radius+'px');app.style.colorScheme=design.appearance==='Hell'?'light':design.appearance==='Dunkel'?'dark':'light dark';};
      const tweak=new Tweak({container:app,onChange:apply});
      tweak.addColorPicker(design,'accent',{label:'Akzentfarbe',reference:'--px-accent-solid'});
      tweak.addSlider(design,'radius',{label:'Abrundung',min:0,max:22,unit:'px',reference:'--px-radius'});
      tweak.addSelect(design,'appearance',{label:'Darstellung',options:['System','Hell','Dunkel']});
    }
  });
  window.addEventListener('openai:set_globals',event=>{
    const restored=event.detail?.globals?.widgetState?.privateContent;if(!restored)return;
    for(const [key,app] of Object.entries(appByDesign)) {const r=restored[key];if(!r)continue;const s=stateByDesign[key];if(['discover','installed','updates'].includes(r.view))s.view=r.view;if(['apps','libraries','kernel','all'].includes(r.kind))s.kind=r.kind;if(['Alle','Spiele','Diagnose'].includes(r.category))s.category=r.category;if(typeof r.query==='string')s.query=r.query;if(get(r.selected))s.selected=r.selected;app.querySelector('[data-search]').value=s.query;render(app);}
  });
})();
</script>
